# Matchmaker daemon configuration (DESIGN §10.1, plan Decision 6).
# Every key is optional; unset values fall back to defaults and every
# value is range-checked at load. Durations are Go duration strings.

state_dir = "~/.local/state/matchmaker"
# Resolved once at daemon startup, never per spawn (DESIGN §5.1).
crush_binary = "crush"
# Loopback bind of the coordination MCP server (DESIGN §5.4). Keep this
# stable across restarts: the onboarding fragment registers this URL.
coordination_addr = "127.0.0.1:4763"
# Environment variable names copied from the daemon environment into every
# crush server child (DESIGN §5.1). The child never inherits the full
# parent environment; global crushrc files that guard provider credentials
# (e.g. ${DIGITALOCEAN_API_KEY:?...}) need their names listed here. Names
# join the deployment fingerprint; values are never logged or fingerprinted.
pass_env = []

[reconcile]
tick_interval = "30s"
sse_reconnect_backoff = "1s"
health_timeout = "5s"
drain_timeout = "30s"
global_drain_deadline = "2m"
max_restarts_per_window = 5
crash_loop_window = "10m"

[reconcile.instance_start_retry]
max_attempts = 3
backoff = "5s"

[goal_limits]
max_steps = 50
max_deps_per_step = 10
max_prompt_bytes = 65536
max_targets_per_step = 10
max_total_runs_per_goal = 200
min_timeout = "5s"
max_timeout = "1h0m0s"
max_retries = 3

[note_limits]
max_note_body_bytes = 4096
max_notes_per_goal = 1000
max_injected_note_bytes = 2048
max_read_page_size = 50
max_result_chunk_bytes = 16384
rate_window = "1m0s"
max_requests_per_window = 120
max_retained_notes = 5000

[planner]
max_objective_bytes = 8192
max_draft_bytes = 65536
max_revisions = 3
max_total_budget = "30m0s"
timeout = "10m0s"

[planner.retry_policy]
max_attempts = 3
backoff = "5s"

[supervision]
cancel_grace = "1m0s"

[fleet_pins]
approved_version = "v0.94.1"
# Deployment-specific: release builds carry the commit as build_id; empty
# means the version pin is checked on its own (DESIGN §9.3).
approved_build_id = ""
